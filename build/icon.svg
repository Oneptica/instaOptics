<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16325c"/>
      <stop offset="1" stop-color="#070f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2f6fd6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2f6fd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe0ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#7fb8f5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#bfe0ff" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="focus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fff4c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#glow)"/>
    <!-- optical axis -->
    <line x1="120" y1="512" x2="904" y2="512" stroke="#8fb3e8" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="26 18"/>
    <!-- incoming parallel rays -->
    <g stroke-width="22" stroke-linecap="round" fill="none">
      <path d="M150 342 L412 342 L760 512" stroke="#4fa3ff"/>
      <path d="M150 682 L412 682 L760 512" stroke="#ff5a5f"/>
      <path d="M150 427 L420 427 L760 512" stroke="#3fd07a" stroke-opacity="0.95"/>
      <path d="M150 597 L420 597 L760 512" stroke="#3fd07a" stroke-opacity="0.95"/>
    </g>
    <!-- biconvex lens -->
    <path d="M412 250 Q352 512 412 774 L452 774 Q512 512 452 250 Z" fill="url(#glass)" stroke="#e8f4ff" stroke-width="10" stroke-linejoin="round"/>
    <!-- focus -->
    <circle cx="760" cy="512" r="92" fill="url(#focus)"/>
    <circle cx="760" cy="512" r="22" fill="#ffffff"/>
  </g>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
</svg>
