name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p instaoptics -p instaoptics-cli
      - uses: actions/upload-artifact@v4
        with:
          name: instaOptics-${{ matrix.os }}
          path: |
            target/release/instaoptics
            target/release/instaoptics-cli
            target/release/instaoptics.exe
            target/release/instaoptics-cli.exe
          if-no-files-found: ignore
          retention-days: 7
