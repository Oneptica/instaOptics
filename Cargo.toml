[workspace]
members = ["crates/optics-core", "crates/optics-node"]
resolver = "3"

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

# Fast-to-build optimized native module for `npm run dev`.
[profile.native-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The physical optics tests propagate full wave fields; unoptimized builds make them many times slower.
[profile.test]
opt-level = 3
